<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vice City Stories — Browser Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#183b31}
#hud{position:fixed;inset:0;pointer-events:none}
#brand{position:absolute;top:18px;left:20px;font-weight:900;font-size:22px;letter-spacing:2px;text-shadow:2px 2px #000}
#stats{position:absolute;top:18px;right:20px;text-align:right;font-weight:bold;text-shadow:2px 2px #000}
#mission{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);background:rgba(0,0,0,.68);padding:12px 18px;border:1px solid rgba(255,255,255,.25);border-radius:12px;min-width:310px;text-align:center}
#hint{position:absolute;left:20px;bottom:20px;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:10px;font-size:13px}
#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#12152c,#5d214e);z-index:3}
.card{max-width:520px;margin:20px;padding:32px;border-radius:22px;background:rgba(8,10,20,.88);box-shadow:0 20px 70px #0008;text-align:center}
h1{font-size:44px;margin:0 0 8px;color:#ff5ca8;text-shadow:3px 3px #2de2e6}
button{border:0;border-radius:12px;padding:13px 22px;background:#ff5ca8;color:#111;font-weight:900;font-size:16px;cursor:pointer}
kbd{background:#222;padding:2px 6px;border-radius:5px}
#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="brand">VICE CITY STORIES</div>
  <div id="stats">💵 $<span id="money">2500</span><br>⭐ <span id="wanted">0</span>/5</div>
  <div id="toast"></div>
  <div id="mission">MISSION: Fahre zum pinken Marker</div>
  <div id="hint">WASD / Pfeiltasten: bewegen · E: Auto ein/aussteigen · Shift: Sprint</div>
</div>
<div id="start">
 <div class="card">
  <h1>VICE CITY STORIES</h1>
  <p>Eine kleine, eigenständige Open-World-Browser-Demo im Stil klassischer Open-World-Games.</p>
  <p><kbd>WASD</kbd> bewegen · <kbd>E</kbd> Fahrzeug · <kbd>Shift</kbd> sprinten</p>
  <button id="play">SPIEL STARTEN</button>
 </div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr=1, keys={}, started=false, money=2500, wanted=0, inCar=false, won=false;
let player={x:900,y:700,a:0,speed:2.8};
let car={x:1050,y:680,a:0};
let cam={x:0,y:0};
const world={w:2200,h:1500};
const roads=[
{x:0,y:560,w:2200,h:150},{x:0,y:1030,w:2200,h:130},
{x:650,y:0,w:150,h:1500},{x:1500,y:0,w:150,h:1500}
];
const buildings=[];
for(let i=0;i<65;i++){
 let x=(i*277)%2100+30,y=(i*193)%1400+30;
 if(roads.some(r=>x<r.x+r.w+15&&x+110>r.x-15&&y<r.y+r.h+15&&y+80>r.y-15)) continue;
 buildings.push({x,y,w:80+(i%4)*28,h:60+(i%3)*35});
}
const npcs=[];
for(let i=0;i<22;i++) npcs.push({x:100+(i*151)%2000,y:150+(i*87)%1200,dx:(i%2?1:-1),dy:0});
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'&&started)toggleCar();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,1800)}
function toggleCar(){
 if(inCar){inCar=false; player.x=car.x+35;player.y=car.y;toast("Ausgestiegen");}
 else if(Math.hypot(player.x-car.x,player.y-car.y)<65){inCar=true;toast("Du sitzt im Auto");}
}
function blocked(x,y){
 if(x<20||y<20||x>world.w-20||y>world.h-20)return true;
 return buildings.some(b=>x>b.x-16&&x<b.x+b.w+16&&y>b.y-16&&y<b.y+b.h+16);
}
function update(){
 let dx=0,dy=0;
 if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;
 let len=Math.hypot(dx,dy)||1, sp=(inCar?6.2:player.speed)*(keys.shift&&!inCar?1.65:1);
 dx=dx/len*sp;dy=dy/len*sp;
 if(dx||dy){let o=inCar?car:player;o.a=Math.atan2(dy,dx);let nx=o.x+dx,ny=o.y+dy;if(!blocked(nx,ny)){o.x=nx;o.y=ny}}
 if(inCar){player.x=car.x;player.y=car.y}
 // wandering NPCs
 npcs.forEach(n=>{n.x+=n.dx*.35;if(n.x<50||n.x>2150)n.dx*=-1});
 let target={x:1880,y:1090};
 if(!won&&Math.hypot(player.x-target.x,player.y-target.y)<75){won=true;money+=1000;document.getElementById('mission').textContent="MISSION GESCHAFFT! +$1000 — freie Fahrt.";toast("Mission geschafft!");}
 if(!won) document.getElementById('mission').textContent="MISSION: Fahre zum pinken Marker";
 cam.x=clamp(player.x-W/2,0,world.w-W);cam.y=clamp(player.y-H/2,0,world.h-H);
 document.getElementById('money').textContent=money;
 document.getElementById('wanted').textContent=wanted;
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);
 // ground
 ctx.fillStyle='#17624d';ctx.fillRect(0,0,world.w,world.h);
 // water
 ctx.fillStyle='#147a92';ctx.fillRect(0,0,2200,130);ctx.fillRect(0,1370,2200,130);
 // roads
 roads.forEach(r=>{ctx.fillStyle='#30343a';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#e9c84a';ctx.lineWidth=4;
  if(r.w>r.h){for(let x=r.x;x<r.x+r.w;x+=55){ctx.beginPath();ctx.moveTo(x,r.y+r.h/2);ctx.lineTo(x+28,r.y+r.h/2);ctx.stroke()}}
  else{for(let y=r.y;y<r.y+r.h;y+=55){ctx.beginPath();ctx.moveTo(r.x+r.w/2,y);ctx.lineTo(r.x+r.w/2,y+28);ctx.stroke()}}
 });
 buildings.forEach((b,i)=>{ctx.fillStyle=['#d26b8d','#c27a58','#a47acb','#e0a45a'][i%4];ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ffe08a';for(let x=b.x+10;x<b.x+b.w-8;x+=22)for(let y=b.y+10;y<b.y+b.h-8;y+=22)ctx.fillRect(x,y,8,9)});
 // mission marker
 let tx=1880,ty=1090;ctx.beginPath();ctx.arc(tx,ty,32+Math.sin(Date.now()/180)*6,0,Math.PI*2);ctx.strokeStyle='#ff4fa3';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#ff4fa3';ctx.globalAlpha=.25;ctx.fill();ctx.globalAlpha=1;
 npcs.forEach(n=>{ctx.fillStyle='#f1c27d';ctx.beginPath();ctx.arc(n.x,n.y-10,7,0,7);ctx.fill();ctx.fillStyle='#333';ctx.fillRect(n.x-7,n.y-3,14,18)});
 // car
 ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);ctx.fillStyle='#18d6c2';ctx.fillRect(-32,-16,64,32);ctx.fillStyle='#132c3b';ctx.fillRect(-13,-12,25,24);ctx.fillStyle='#111';ctx.fillRect(-25,-20,14,8);ctx.fillRect(11,-20,14,8);ctx.fillRect(-25,12,14,8);ctx.fillRect(11,12,14,8);ctx.restore();
 // player
 if(!inCar){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x,player.y-14,9,0,7);ctx.fill();ctx.fillStyle='#ff5ca8';ctx.fillRect(player.x-9,player.y-5,18,25);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.strokeRect(player.x-9,player.y-5,18,25)}
 ctx.restore();
}
function loop(){if(started){update();draw()}requestAnimationFrame(loop)}
document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none';toast("Willkommen in Vice City!");};
loop();
</script>
</body>
</html>
